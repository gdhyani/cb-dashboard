name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx biome check src test
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  contract:
    name: contract types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run sync:contract
        env:
          CB_CONTRACT_PATH: https://raw.githubusercontent.com/gdhyani/cb-backend/main/contracts/openapi.yaml
      - name: Fail if the generated types drifted from the backend contract
        run: git diff --exit-code -- src/shared/contract
