<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<title>The three layers inside cb: @cb/env, the gateway and the vault</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset="1" stop-color="#111317"/></linearGradient><radialGradient id="glow" cx="0" cy="0" r="1.1"><stop offset="0" stop-color="#ffd84a" stop-opacity="0.1"/><stop offset="0.6" stop-color="#ffd84a" stop-opacity="0.025"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#ecece7" fill-opacity="0.06"/></pattern></defs>
<rect width="1200" height="675" fill="url(#g)"/>
<rect width="1200" height="675" fill="url(#dots)"/>
<rect width="1200" height="675" fill="url(#glow)"/>
<rect x="56" y="56" width="1088" height="563" rx="22" fill="#0b0c0e" fill-opacity="0.9" stroke="#2b2e33" stroke-width="1"/>
<rect x="260" y="160" width="620" height="110" rx="16" fill="#111317" stroke="#34373d" stroke-width="2"/><text x="296" y="210" fill="#ecece7" font-size="28" font-family="Fragment Mono, ui-monospace, Menlo, monospace">@cb/env</text><text x="296" y="244" fill="#a6aab1" font-size="20" font-family="Archivo, Helvetica Neue, Arial, sans-serif">CLI, agent, preload</text>
<rect x="320" y="300" width="620" height="110" rx="16" fill="#111317" stroke="#34373d" stroke-width="2"/><text x="356" y="350" fill="#ecece7" font-size="28" font-family="Fragment Mono, ui-monospace, Menlo, monospace">gateway</text><text x="356" y="384" fill="#a6aab1" font-size="20" font-family="Archivo, Helvetica Neue, Arial, sans-serif">TLS, adapters, redaction</text>
<rect x="380" y="440" width="620" height="110" rx="16" fill="#111317" stroke="#ffd84a" stroke-width="2"/><text x="416" y="490" fill="#ecece7" font-size="28" font-family="Fragment Mono, ui-monospace, Menlo, monospace">vault</text><text x="416" y="524" fill="#a6aab1" font-size="20" font-family="Archivo, Helvetica Neue, Arial, sans-serif">AES-256-GCM, HMAC stand-ins</text>
<circle cx="1020" cy="495" r="10" fill="#ffd84a"/></svg>