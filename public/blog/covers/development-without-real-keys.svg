<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<title>A .env file holds only a cb stand-in key while the real key stays locked away</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset="1" stop-color="#111317"/></linearGradient><radialGradient id="glow" cx="0" cy="0" r="1.1"><stop offset="0" stop-color="#ffd84a" stop-opacity="0.1"/><stop offset="0.6" stop-color="#ffd84a" stop-opacity="0.025"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#ecece7" fill-opacity="0.06"/></pattern></defs>
<rect width="1200" height="675" fill="url(#g)"/>
<rect width="1200" height="675" fill="url(#dots)"/>
<rect width="1200" height="675" fill="url(#glow)"/>
<rect x="56" y="56" width="1088" height="563" rx="22" fill="#0b0c0e" fill-opacity="0.9" stroke="#2b2e33" stroke-width="1"/>

<rect x="200" y="200" width="380" height="240" rx="14" fill="#111317" stroke="#34373d" stroke-width="2"/>
<rect x="160" y="440" width="460" height="22" rx="8" fill="#16191d"/>
<text x="230" y="290" fill="#a6aab1" font-size="22" font-family="Fragment Mono, ui-monospace, Menlo, monospace">.env</text>
<text x="230" y="335" fill="#ffd84a" font-size="22" font-family="Fragment Mono, ui-monospace, Menlo, monospace">KEY=sk_test_cb_7Hq2…</text>
<text x="230" y="375" fill="#ffd84a" font-size="22" font-family="Fragment Mono, ui-monospace, Menlo, monospace">stand-in only</text>
<path d="M600 320 H780" stroke="#7d828a" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="800" y="210" width="220" height="220" rx="18" fill="#111317" stroke="#7d828a" stroke-width="2"/>
<rect x="870" y="300" width="80" height="70" rx="10" fill="none" stroke="#ff5b3d" stroke-width="4"/>
<path d="M885 300 v-22 a25 25 0 0 1 50 0 v22" fill="none" stroke="#ff5b3d" stroke-width="4"/>
<text x="910" y="400" text-anchor="middle" fill="#ff5b3d" font-size="18" font-family="Archivo, Helvetica Neue, Arial, sans-serif">real key</text>
</svg>