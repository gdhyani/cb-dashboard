<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<title>Local values: a feature flag, a port and a secret that stays yours only</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset="1" stop-color="#111317"/></linearGradient><radialGradient id="glow" cx="0" cy="0" r="1.1"><stop offset="0" stop-color="#ffd84a" stop-opacity="0.1"/><stop offset="0.6" stop-color="#ffd84a" stop-opacity="0.025"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#ecece7" fill-opacity="0.06"/></pattern></defs>
<rect width="1200" height="675" fill="url(#g)"/>
<rect width="1200" height="675" fill="url(#dots)"/>
<rect width="1200" height="675" fill="url(#glow)"/>
<rect x="56" y="56" width="1088" height="563" rx="22" fill="#0b0c0e" fill-opacity="0.9" stroke="#2b2e33" stroke-width="1"/>

<rect x="170" y="230" width="200" height="100" rx="50" fill="#4ccf7a"/><circle cx="320" cy="280" r="40" fill="#111317"/>
<text x="170" y="390" fill="#a6aab1" font-size="24" font-family="Fragment Mono, ui-monospace, Menlo, monospace">ENABLE_CHECKOUT_V2</text>
<text x="520" y="300" fill="#ecece7" font-size="88" font-family="Fragment Mono, ui-monospace, Menlo, monospace">:3000</text>
<text x="520" y="390" fill="#a6aab1" font-size="24" font-family="Fragment Mono, ui-monospace, Menlo, monospace">PORT</text>
<rect x="860" y="220" width="190" height="120" rx="14" fill="#111317" stroke="#a598e6" stroke-width="3"/>
<text x="955" y="292" text-anchor="middle" fill="#a598e6" font-size="22" font-family="Fragment Mono, ui-monospace, Menlo, monospace">yours only</text>
<text x="860" y="390" fill="#a6aab1" font-size="24" font-family="Fragment Mono, ui-monospace, Menlo, monospace">AUTH_SECRET</text>
</svg>