<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<title>Lines of a .env file, including real secrets, become plain strings in process.env</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset="1" stop-color="#111317"/></linearGradient><radialGradient id="glow" cx="0" cy="0" r="1.1"><stop offset="0" stop-color="#ffd84a" stop-opacity="0.1"/><stop offset="0.6" stop-color="#ffd84a" stop-opacity="0.025"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#ecece7" fill-opacity="0.06"/></pattern></defs>
<rect width="1200" height="675" fill="url(#g)"/>
<rect width="1200" height="675" fill="url(#dots)"/>
<rect width="1200" height="675" fill="url(#glow)"/>
<rect x="56" y="56" width="1088" height="563" rx="22" fill="#0b0c0e" fill-opacity="0.9" stroke="#2b2e33" stroke-width="1"/>
<text x="140" y="175" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">PORT=</text><text x="220" y="175" fill="#ecece7" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">3000</text>
<text x="140" y="237" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">NODE_ENV=</text><text x="284" y="237" fill="#ecece7" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">development</text>
<text x="140" y="299" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">NEXT_PUBLIC_APP_URL=</text><text x="460" y="299" fill="#ecece7" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">https://shop.test</text>
<text x="140" y="361" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">DATABASE_URL=</text><text x="348" y="361" fill="#ff5b3d" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">postgres://app:••••@db</text>
<text x="140" y="423" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">STRIPE_SECRET_KEY=</text><text x="428" y="423" fill="#ff5b3d" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">sk_live_••••</text>
<text x="140" y="485" fill="#a6aab1" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">SESSION_SECRET=</text><text x="380" y="485" fill="#ff5b3d" font-size="26" font-family="Fragment Mono, ui-monospace, Menlo, monospace">••••••••</text>

<path d="M760 300 H860" stroke="#7d828a" stroke-width="2"/><path d="M850 292 L862 300 L850 308" fill="#7d828a"/>
<rect x="870" y="230" width="220" height="140" rx="14" fill="#111317" stroke="#7d828a" stroke-width="2"/>
<text x="980" y="292" text-anchor="middle" fill="#ecece7" font-size="24" font-family="Fragment Mono, ui-monospace, Menlo, monospace">process.env</text>
<text x="980" y="328" text-anchor="middle" fill="#a6aab1" font-size="18" font-family="Archivo, Helvetica Neue, Arial, sans-serif">plain strings</text>
</svg>